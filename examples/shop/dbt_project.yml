name: shop
version: 1.0.0
config-version: 2
profile: shop
require-dbt-version: ">=1.6.0"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
log-path: "logs"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

quoting:
  database: false
  schema: false
  identifier: false

vars:
  promotion_log_schema: promotion_logs
  promotion_skip_schemas: []
  cleanup_build_schemas_to_keep: 5

models:
  shop:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts

seeds:
  shop:
    +schema: staging
